[package]
name = "rpgmasd"
version = "4.0.0"
edition = "2024"
rust-version = "1.85.0"
license = "WTFPL"

[dependencies]
clap = { version = "4.6.7", features = ["cargo", "derive"] }
asset-decrypter = { package = "rpgm-asset-decrypter-lib", version = "4.0.0" }
anyhow = "1.0.104"
serde_json = "1.0.154"

[profile.release]
lto = "fat"
debug = false
debug-assertions = false
overflow-checks = false
codegen-units = 1
opt-level = 3
panic = "abort"
strip = "symbols"

[profile.release.build-override]
debug = false
debug-assertions = false
overflow-checks = false
codegen-units = 1
opt-level = 3
strip = "symbols"
